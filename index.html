<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aquarium 3D Ultra — Realistic Underwater World</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #020611;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #e0f2fe;
      touch-action: none;
      overscroll-behavior: none;
    }
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      touch-action: none;
    }

    /* Glassmorphism UI */
    .ui-container {
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }

    /* Top Header */
    .header-bar {
      top: calc(16px + env(safe-area-inset-top, 0px));
      left: calc(16px + env(safe-area-inset-left, 0px));
      right: calc(16px + env(safe-area-inset-right, 0px));
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .brand {
      background: rgba(10, 25, 47, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      padding: 10px 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 12px rgba(56, 189, 248, 0.1);
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      margin-right: auto;
    }
    .brand-icon {
      font-size: 24px;
      animation: floatIcon 3s ease-in-out infinite;
      display: flex;
      align-items: center;
    }
    @keyframes floatIcon {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(6deg); }
    }
    .brand-text h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #34d399);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }
    .brand-text p {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
    }

    /* Top Action Buttons */
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }
    .action-btn {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #e2e8f0;
      padding: 9px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
      min-height: 38px;
    }
    .action-btn:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: rgba(56, 189, 248, 0.6);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.35);
    }
    .action-btn:active {
      transform: scale(0.97);
    }

    /* Bottom Control Dock */
    .bottom-dock {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom, 16px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 22, 40, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      padding: 8px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 0 16px rgba(56, 189, 248, 0.1);
      pointer-events: auto;
      max-width: calc(100vw - 24px);
      z-index: 10;
    }
    .dock-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .dock-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #cbd5e1;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
      min-height: 38px;
    }
    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #38bdf8;
    }
    .dock-btn.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: rgba(56, 189, 248, 0.55);
      color: #38bdf8;
      font-weight: 600;
    }
    .dock-btn:active {
      transform: scale(0.96);
    }
    .dock-divider {
      width: 1px;
      height: 22px;
      background: rgba(148, 163, 184, 0.25);
      flex-shrink: 0;
    }

    /* Hint / Tip */
    .interaction-hint {
      position: absolute;
      bottom: calc(76px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(226, 232, 240, 0.85);
      background: rgba(0, 0, 0, 0.55);
      padding: 6px 14px;
      border-radius: 20px;
      letter-spacing: 0.2px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      pointer-events: none;
      animation: pulseHint 3s infinite ease-in-out;
      white-space: nowrap;
      max-width: 92vw;
      text-overflow: ellipsis;
      overflow: hidden;
      text-align: center;
    }
    @keyframes pulseHint {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }

    /* Stats Panel */
    .fish-info-card {
      position: absolute;
      right: calc(16px + env(safe-area-inset-right, 0px));
      bottom: calc(84px + env(safe-area-inset-bottom, 0px));
      background: rgba(10, 22, 40, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      padding: 12px 16px;
      font-size: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      pointer-events: auto;
      min-width: 175px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .fish-info-title {
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .fish-info-close {
      display: none;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
    }
    .fish-info-item {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
      padding: 2px 0;
    }
    .fish-info-item span:last-child {
      color: #e2e8f0;
      font-weight: 500;
    }

    /* Ripple Indicator */
    .food-splash-indicator {
      position: absolute;
      pointer-events: none;
      width: 32px;
      height: 32px;
      border: 2px solid rgba(56, 189, 248, 0.85);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.2);
      animation: rippleAnim 0.6s ease-out forwards;
      z-index: 5;
    }
    @keyframes rippleAnim {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
    }

    /* Mobile & Portrait Layout (Redmi, iPhone, Galaxy, Tablets in Portrait, Screens <= 860px) */
    @media (max-width: 860px), (orientation: portrait) {
      .header-bar {
        top: calc(8px + env(safe-area-inset-top, 0px));
        left: calc(8px + env(safe-area-inset-left, 0px));
        right: calc(8px + env(safe-area-inset-right, 0px));
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .brand {
        padding: 5px 10px;
        border-radius: 12px;
        margin-right: 0;
        flex: 0 1 auto;
      }
      .brand-icon {
        font-size: 18px;
      }
      .brand-text h1 {
        font-size: 13px;
      }
      .brand-text p {
        display: none;
      }
      .lang-dropdown {
        flex-shrink: 0;
        z-index: 100;
      }
      .lang-dropdown-btn {
        padding: 6px 9px;
        font-size: 11px;
        min-height: 34px;
        border-radius: 10px;
      }
      .lang-dropdown-menu {
        right: 0;
        left: auto;
        max-width: calc(100vw - 16px);
      }
      body.rtl .lang-dropdown-menu {
        right: auto;
        left: 0;
      }
      .top-actions {
        width: 100%;
        order: 3;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
        margin-top: 2px;
      }
      .action-btn {
        padding: 6px 2px;
        font-size: 11px;
        min-height: 36px;
        border-radius: 10px;
        width: 100%;
        justify-content: center;
        gap: 3px;
      }
      .action-btn .btn-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .interaction-hint {
        position: fixed;
        bottom: calc(108px + env(safe-area-inset-bottom, 10px));
        font-size: 10px;
        padding: 5px 12px;
        max-width: 90vw;
        z-index: 9;
      }
      .bottom-dock {
        position: fixed;
        bottom: max(10px, env(safe-area-inset-bottom, 10px));
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 16px);
        max-width: 440px;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        border-radius: 18px;
        z-index: 15;
      }
      .dock-divider {
        display: none;
      }
      .dock-group {
        width: 100%;
      }
      .dock-group-light {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
      }
      .dock-group-cam {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        max-width: 260px;
        margin: 0 auto;
        gap: 8px;
      }
      .dock-btn {
        width: 100%;
        min-width: 0;
        justify-content: center;
        padding: 7px 2px;
        font-size: 11px;
        min-height: 35px;
        gap: 3px;
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
      }

      /* Mobile Drawer for Fish Stats */
      .fish-info-card {
        position: fixed;
        right: 10px;
        left: 10px;
        bottom: calc(112px + env(safe-area-inset-bottom, 10px));
        min-width: unset;
        display: none;
        z-index: 20;
      }
      .fish-info-card.mobile-open {
        display: block;
        animation: slideUpFade 0.25s ease-out;
      }
      .fish-info-close {
        display: block;
      }
      @keyframes slideUpFade {
        from { transform: translateY(16px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
    }

    @media (max-width: 380px) {
      .brand-text h1 {
        font-size: 11.5px;
      }
      .action-btn {
        font-size: 9.5px;
        padding: 5px 1px;
      }
      .dock-btn {
        font-size: 9.5px;
        padding: 6px 1px;
      }
      .dock-group-cam {
        max-width: 220px;
      }
    }

    /* Mobile Landscape Optimization */
    @media (max-height: 520px) and (orientation: landscape) {
      .header-bar {
        top: calc(4px + env(safe-area-inset-top, 0px));
        left: calc(6px + env(safe-area-inset-left, 0px));
        right: calc(6px + env(safe-area-inset-right, 0px));
        flex-wrap: nowrap;
        gap: 6px;
      }
      .brand {
        padding: 4px 8px;
        border-radius: 10px;
      }
      .brand-text p {
        display: none;
      }
      .brand-text h1 {
        font-size: 12px;
      }
      .top-actions {
        order: 2;
        width: auto;
        display: flex;
        gap: 4px;
      }
      .action-btn {
        padding: 4px 8px;
        min-height: 28px;
        font-size: 10px;
        border-radius: 8px;
      }
      .bottom-dock {
        bottom: max(6px, env(safe-area-inset-bottom, 6px));
        flex-direction: row;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 14px;
        max-width: 95vw;
      }
      .dock-divider {
        display: block;
        height: 18px;
      }
      .dock-group-light {
        display: flex;
        gap: 3px;
      }
      .dock-group-cam {
        display: flex;
        gap: 3px;
        max-width: none;
        margin: 0;
      }
      .dock-btn {
        padding: 4px 8px;
        font-size: 10.5px;
        min-height: 28px;
        border-radius: 8px;
      }
      .interaction-hint {
        display: none;
      }
      .fish-info-card {
        right: 8px;
        left: auto;
        bottom: calc(48px + env(safe-area-inset-bottom, 6px));
        max-width: 240px;
        padding: 8px 12px;
        font-size: 11px;
      }
    }

    /* Language Dropdown Menu */
    .lang-dropdown {
      position: relative;
      display: inline-block;
      pointer-events: auto;
    }
    .lang-dropdown-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.28);
      color: #e2e8f0;
      padding: 7px 11px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      min-height: 38px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      user-select: none;
    }
    .lang-dropdown-btn:hover {
      background: rgba(30, 41, 59, 0.95);
      border-color: #38bdf8;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.3);
      color: #38bdf8;
    }
    .lang-dropdown-btn:active {
      transform: scale(0.97);
    }
    .lang-dropdown-btn .lang-flag {
      font-size: 14px;
      line-height: 1;
    }
    .lang-dropdown-btn .lang-code {
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .lang-dropdown-btn .lang-arrow {
      font-size: 9px;
      opacity: 0.7;
      transition: transform 0.2s ease;
      display: inline-block;
    }
    .lang-dropdown.open .lang-dropdown-btn .lang-arrow {
      transform: rotate(180deg);
    }
    .lang-dropdown.open .lang-dropdown-btn {
      border-color: #38bdf8;
      background: rgba(30, 41, 59, 0.95);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
    }

    .lang-dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 145px;
      background: rgba(11, 20, 38, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 12px;
      padding: 5px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 16px rgba(56, 189, 248, 0.15);
      display: flex;
      flex-direction: column;
      gap: 3px;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
      pointer-events: none;
    }
    .lang-dropdown.open .lang-dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }

    .lang-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
    }
    .lang-option:hover {
      background: rgba(56, 189, 248, 0.12);
      color: #f0f9ff;
    }
    .lang-option.active {
      background: rgba(56, 189, 248, 0.22);
      color: #38bdf8;
      font-weight: 700;
    }
    .lang-option .option-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lang-option .option-flag {
      font-size: 14px;
    }
    .lang-option .option-check {
      font-size: 12px;
      color: #38bdf8;
      opacity: 0;
    }
    .lang-option.active .option-check {
      opacity: 1;
    }

    /* RTL Support for Hebrew */
    body.rtl {
      direction: rtl;
    }
    body.rtl .brand-text {
      text-align: right;
    }
    body.rtl .fish-info-card {
      left: calc(16px + env(safe-area-inset-left, 0px));
      right: auto;
      text-align: right;
    }
    body.rtl .fish-info-title,
    body.rtl .fish-info-item {
      direction: rtl;
    }
    body.rtl .lang-dropdown-menu {
      right: auto;
      left: 0;
    }
    body.rtl .lang-option {
      text-align: right;
    }
  </style>

  <!-- Three.js & Controls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <!-- Top bar -->
  <div class="ui-container header-bar">
    <div class="brand">
      <div class="brand-icon">🐠</div>
      <div class="brand-text">
        <h1>Aquarium 3D Ultra</h1>
        <p id="brand-subtitle">Tropical Reef Biotope • Anatomical 3D Fish</p>
      </div>
    </div>

    <!-- Language Dropdown Switcher -->
    <div class="lang-dropdown" id="lang-dropdown">
      <button class="lang-dropdown-btn" id="lang-dropdown-btn" aria-haspopup="true" aria-expanded="false" title="Language / Язык / שפה">
        <span class="lang-flag" id="lang-current-flag">🇺🇸</span>
        <span class="lang-code" id="lang-current-code">EN</span>
        <span class="lang-arrow">▾</span>
      </button>
      <div class="lang-dropdown-menu" id="lang-dropdown-menu" role="menu">
        <button class="lang-option active" data-lang="en" role="menuitem">
          <span class="option-left">
            <span class="option-flag">🇺🇸</span>
            <span class="option-name">English</span>
          </span>
          <span class="option-check">✓</span>
        </button>
        <button class="lang-option" data-lang="ru" role="menuitem">
          <span class="option-left">
            <span class="option-flag">🇷🇺</span>
            <span class="option-name">Русский</span>
          </span>
          <span class="option-check">✓</span>
        </button>
        <button class="lang-option" data-lang="he" role="menuitem">
          <span class="option-left">
            <span class="option-flag">🇮🇱</span>
            <span class="option-name">עברית</span>
          </span>
          <span class="option-check">✓</span>
        </button>
      </div>
    </div>

    <div class="top-actions">
      <button class="action-btn" id="feed-btn">
        <span>🍤</span> <span class="btn-text" id="feed-text">Feed</span>
      </button>
      <button class="action-btn" id="add-fish-btn">
        <span>➕</span> <span class="btn-text" id="add-fish-text">Add Fish</span>
      </button>
      <button class="action-btn" id="sound-btn">
        <span id="sound-icon">🔈</span> <span class="btn-text" id="sound-text">Sound</span>
      </button>
      <button class="action-btn" id="info-toggle-btn">
        <span>📊</span> <span class="btn-text" id="info-text">Stats</span>
      </button>
      <button class="action-btn" id="download-btn" style="background: rgba(14, 165, 233, 0.35); border-color: #38bdf8;">
        <span>💾</span> <span class="btn-text" id="download-text">Download</span>
      </button>
    </div>
  </div>

  <!-- Hint -->
  <div class="interaction-hint" id="interaction-hint">
    ✨ Click anywhere to feed • Hold Left Click to rotate camera
  </div>

  <!-- Bottom Control Dock -->
  <div class="ui-container bottom-dock" id="bottom-dock">
    <div class="dock-group dock-group-light">
      <button class="dock-btn active" data-light="day" id="dock-day">☀️ Day</button>
      <button class="dock-btn" data-light="sunset" id="dock-sunset">🌅 Sunset</button>
      <button class="dock-btn" data-light="night" id="dock-night">🌙 Neon</button>
      <button class="dock-btn" id="bubbles-toggle">🫧 Bubbles: On</button>
    </div>
    <div class="dock-divider"></div>
    <div class="dock-group dock-group-cam">
      <button class="dock-btn" data-cam="follow" id="dock-follow">🐟 Follow</button>
      <button class="dock-btn active" data-cam="front" id="dock-front">🔍 Front</button>
    </div>
  </div>

  <!-- Fish Info Card -->
  <div class="ui-container fish-info-card" id="fish-info-card">
    <div class="fish-info-title">
      <span id="info-card-title">🌊 Aquarium Inhabitants</span>
      <button class="fish-info-close" id="close-info-btn">✕</button>
    </div>
    <div class="fish-info-item">
      <span id="label-clown">Clownfish (Ocellaris):</span>
      <span id="count-clown">3</span>
    </div>
    <div class="fish-info-item">
      <span id="label-tang">Blue Tang (Dory):</span>
      <span id="count-tang">2</span>

    <div class="fish-info-item">
      <span id="label-discus">Turquoise Discus:</span>
      <span id="count-discus">2</span>

      <span id="label-tetra">Neon Tetras:</span>
      <span id="count-tetra">7</span>

    <div class="fish-info-item" style="border-top: 1px solid rgba(255,255,255,0.1); margin-top: 4px; padding-top: 4px;">
      <span id="label-total">Total fish:</span>
      <span id="count-total" style="color: #38bdf8; font-weight:700;">14</span>

  </div>

  <script>
    /* =========================================================================
       3D REALISTIC AQUARIUM SIMULATION ENGINE
       - Anatomical Sculpted 3D Fish Bodies (Forehead, Snout, Lips, Flanks, Keel)
       - Volumetric Contoured Fins with Fin-Ray Detailing & Translucency
       - 3D Layered Eyes with Pupils & Clearcoat Cornea
       - Photorealistic Procedural Scale Textures & Markings
       - Natural Thrust-Driven Swimming Kinematics & Turning Body Curvature
       - Aquatic Grass Swaying, Realistic Rocks, Pebbles & Caustics
       ========================================================================= */

    const TANK_WIDTH = 26;
    const TANK_HEIGHT = 15;
    const TANK_DEPTH = 14;

    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020d1a);
    scene.fog = new THREE.FogExp2(0x06283d, 0.024);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2, 28);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 + 0.08;
    controls.minDistance = 6;
    controls.maxDistance = 42;
    controls.target.set(0, 0, 0);

    // =========================================================================
    // AUDIO SYNTHESIZER (Web Audio API - Pure procedural relaxing aquatic sounds)
    // =========================================================================
    let audioCtx = null;
    let isSoundPlaying = false;
    let waterSoundGain = null;

    function initAudio() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.05;
        b6 = white * 0.115926;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(320, audioCtx.currentTime);

      waterSoundGain = audioCtx.createGain();
      waterSoundGain.gain.setValueAtTime(0, audioCtx.currentTime);

      whiteNoise.connect(filter);
      filter.connect(waterSoundGain);
      waterSoundGain.connect(audioCtx.destination);
      whiteNoise.start();

      setInterval(() => {
        if (!isSoundPlaying || Math.random() > 0.4) return;
        playBubblePop();
      }, 700);
    }

    function playBubblePop() {
      if (!audioCtx || !isSoundPlaying) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const now = audioCtx.currentTime;
      const startFreq = 400 + Math.random() * 500;
      osc.type = 'sine';
      osc.frequency.setValueAtTime(startFreq, now);
      osc.frequency.exponentialRampToValueAtTime(startFreq * 1.8, now + 0.12);

      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    }

    function playFeedSound() {
      if (!audioCtx || !isSoundPlaying) return;
      for (let i = 0; i < 3; i++) {
        setTimeout(() => playBubblePop(), i * 60);
      }
    }

    // =========================================================================
    // LIGHTING SETUP & MODES
    // =========================================================================
    const ambientLight = new THREE.AmbientLight(0x082f49, 1.25);
    scene.add(ambientLight);

    const mainSunLight = new THREE.DirectionalLight(0xe0f2fe, 2.5);
    mainSunLight.position.set(0, TANK_HEIGHT + 8, 2);
    mainSunLight.castShadow = true;
    mainSunLight.shadow.mapSize.width = 2048;
    mainSunLight.shadow.mapSize.height = 2048;
    mainSunLight.shadow.bias = -0.001;
    scene.add(mainSunLight);

    const floorBounceLight = new THREE.DirectionalLight(0x0ea5e9, 0.6);
    floorBounceLight.position.set(0, -TANK_HEIGHT, 0);
    scene.add(floorBounceLight);

    const aquaPointLight1 = new THREE.PointLight(0x38bdf8, 1.2, 25);
    aquaPointLight1.position.set(-6, 3, 2);
    scene.add(aquaPointLight1);

    const aquaPointLight2 = new THREE.PointLight(0x10b981, 0.9, 25);
    aquaPointLight2.position.set(7, -2, -2);
    scene.add(aquaPointLight2);

    function applyLightingMode(mode) {
      if (mode === 'day') {
        scene.background.set(0x020d1a);
        scene.fog.color.set(0x06283d);
        scene.fog.density = 0.024;
        ambientLight.color.set(0x082f49);
        ambientLight.intensity = 1.25;
        mainSunLight.color.set(0xe0f2fe);
        mainSunLight.intensity = 2.5;
        aquaPointLight1.color.set(0x38bdf8);
        aquaPointLight2.color.set(0x10b981);
        waterMesh.material.color.set(0x38bdf8);
      } else if (mode === 'sunset') {
        scene.background.set(0x120817);
        scene.fog.color.set(0x271329);
        scene.fog.density = 0.026;
        ambientLight.color.set(0x3b112c);
        ambientLight.intensity = 1.0;
        mainSunLight.color.set(0xfb923c);
        mainSunLight.intensity = 2.0;
        aquaPointLight1.color.set(0xf43f5e);
        aquaPointLight2.color.set(0xf59e0b);
        waterMesh.material.color.set(0xfb7185);
      } else if (mode === 'night') {
        scene.background.set(0x010409);
        scene.fog.color.set(0x030a1c);
        scene.fog.density = 0.032;
        ambientLight.color.set(0x031738);
        ambientLight.intensity = 0.6;
        mainSunLight.color.set(0x38bdf8);
        mainSunLight.intensity = 1.0;
        aquaPointLight1.color.set(0x818cf8);
        aquaPointLight2.color.set(0x06b6d4);
        waterMesh.material.color.set(0x4f46e5);
      }
    }

    // =========================================================================
    // PROCEDURAL TEXTURE GENERATORS (Fine Scales, Caustics, Markings)
    // =========================================================================

    // Caustics Texture
    const causticsCanvas = document.createElement('canvas');
    causticsCanvas.width = 512;
    causticsCanvas.height = 512;
    const causticsCtx = causticsCanvas.getContext('2d');
    const causticsTexture = new THREE.CanvasTexture(causticsCanvas);
    causticsTexture.wrapS = THREE.RepeatWrapping;
    causticsTexture.wrapT = THREE.RepeatWrapping;
    causticsTexture.repeat.set(3, 2);

    function updateCaustics(time) {
      const w = causticsCanvas.width;
      const h = causticsCanvas.height;
      causticsCtx.fillStyle = '#011528';
      causticsCtx.fillRect(0, 0, w, h);

      causticsCtx.fillStyle = 'rgba(70, 215, 255, 0.12)';
      causticsCtx.lineWidth = 4;
      causticsCtx.strokeStyle = 'rgba(150, 240, 255, 0.4)';

      for (let i = 0; i < 28; i++) {
        const x = (Math.sin(i * 1.3 + time * 0.8) * 0.4 + 0.5) * w;
        const y = (Math.cos(i * 1.7 + time * 0.7) * 0.4 + 0.5) * h;
        const radius = 35 + Math.sin(time * 2 + i) * 15;

        causticsCtx.beginPath();
        causticsCtx.arc(x, y, radius, 0, Math.PI * 2);
        causticsCtx.stroke();
        causticsCtx.fill();
      }
      causticsTexture.needsUpdate = true;
    }

    // Sand Texture
    function createSandTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 1024;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#b8a686';
      ctx.fillRect(0, 0, 1024, 1024);

      for (let i = 0; i < 160000; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        const shade = Math.random() * 40 - 20;
        const r = Math.floor(184 + shade);
        const g = Math.floor(166 + shade * 0.9);
        const b = Math.floor(134 + shade * 0.8);
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(x, y, 1.5, 1.5);
      }

      ctx.fillStyle = 'rgba(120, 100, 75, 0.15)';
      for (let y = 0; y < 1024; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x <= 1024; x += 30) {
          ctx.lineTo(x, y + Math.sin(x * 0.02) * 14);
        }
        ctx.lineTo(1024, y + 20);
        ctx.lineTo(0, y + 20);
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 3);
      return tex;
    }

    // Helper: Draw micro-scale pattern onto canvas
    function drawMicroScales(ctx, w, h, opacity = 0.12) {
      ctx.save();
      ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
      ctx.lineWidth = 1;
      const step = 9;
      for (let y = 10; y < h - 10; y += step) {
        const offset = ((y / step) % 2) * (step / 2);
        for (let x = 10; x < w - 10; x += step) {
          ctx.beginPath();
          ctx.arc(x + offset, y, step * 0.65, 0, Math.PI);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    // 1. Ultra-Vibrant Clownfish Skin (Amphiprion ocellaris)
    function createClownfishTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 512;
      const ctx = c.getContext('2d');

      // Intense fiery mandarin & orange gradient
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, '#c2410c');    // Rich crimson-amber spine
      grad.addColorStop(0.2, '#ea580c');  // Fiery saturated orange
      grad.addColorStop(0.55, '#f97316'); // Luminous coral tangerine
      grad.addColorStop(0.85, '#fb923c'); // Warm sunny orange
      grad.addColorStop(1, '#ffedd5');    // Delicate peach ventral edge
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 512);

      // Micro pearlescent scales
      drawMicroScales(ctx, 1024, 512, 0.22);

      // 3 Iconic White Bars with crisp obsidian borders & golden rims
      const bands = [
        { cx: 300, w: 92, curve: 35 },
        { cx: 560, w: 108, curve: 45 },
        { cx: 840, w: 78, curve: 20 }
      ];

      bands.forEach(b => {
        // Deep obsidian black border
        ctx.fillStyle = '#050507';
        ctx.beginPath();
        ctx.ellipse(b.cx, 256, (b.w / 2) + 14, 235, 0, 0, Math.PI * 2);
        ctx.fill();

        // Brilliant pure porcelain white core
        const wGrad = ctx.createLinearGradient(b.cx - b.w, 0, b.cx + b.w, 0);
        wGrad.addColorStop(0, '#f1f5f9');
        wGrad.addColorStop(0.5, '#ffffff');
        wGrad.addColorStop(1, '#f1f5f9');
        ctx.fillStyle = wGrad;
        ctx.beginPath();
        ctx.ellipse(b.cx, 256, b.w / 2, 224, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      // Operculum (gill cover) crease
      ctx.strokeStyle = 'rgba(120, 25, 0, 0.55)';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(380, 260, 110, -0.6, 0.6);
      ctx.stroke();

      // Radiant fin tip edging
      ctx.fillStyle = '#09090b';
      ctx.fillRect(988, 0, 36, 512);

      return new THREE.CanvasTexture(c);
    }

    // 2. High-Saturation Royal Sapphire Blue Tang (Paracanthurus hepatus)
    function createTangTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 512;
      const ctx = c.getContext('2d');

      // Electric royal sapphire blue gradient
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, '#0a239c');
      grad.addColorStop(0.3, '#1d4ed8');
      grad.addColorStop(0.65, '#2563eb');
      grad.addColorStop(0.85, '#3b82f6');
      grad.addColorStop(1, '#1e3a8a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 512);

      drawMicroScales(ctx, 1024, 512, 0.16);

      // Velvet pitch-black palette swirl pattern for punchy contrast
      ctx.fillStyle = '#05070d';
      ctx.beginPath();
      ctx.moveTo(240, 115);
      ctx.bezierCurveTo(450, 50, 720, 70, 820, 195);
      ctx.bezierCurveTo(865, 255, 815, 355, 680, 345);
      ctx.bezierCurveTo(520, 335, 480, 185, 320, 195);
      ctx.bezierCurveTo(240, 205, 220, 135, 240, 115);
      ctx.closePath();
      ctx.fill();

      // Vivid Fluorescent Canary Yellow Tail Fin Wedge
      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.moveTo(760, 135);
      ctx.lineTo(1024, 35);
      ctx.lineTo(1024, 477);
      ctx.lineTo(760, 377);
      ctx.closePath();
      ctx.fill();

      // Electric blue outline along the yellow tail
      ctx.strokeStyle = '#1d4ed8';
      ctx.lineWidth = 16;
      ctx.stroke();

      // Luminous yellow scalpel spine mark
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.ellipse(820, 256, 30, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      return new THREE.CanvasTexture(c);
    }

    // 3. Radiant Tropical Rainbow Discus (Symphysodon)
    function createDiscusTexture() {
      const c = document.createElement('canvas');
      c.width = 1024;
      c.height = 1024;
      const ctx = c.getContext('2d');

      // Radiant Sunset & Turquoise radial gradient
      const grad = ctx.createRadialGradient(512, 512, 60, 512, 512, 512);
      grad.addColorStop(0, '#00ffff');    // Electric cyan center
      grad.addColorStop(0.3, '#0284c7');  // Deep turquoise
      grad.addColorStop(0.65, '#e11d48'); // Fiery tropical rose-red
      grad.addColorStop(0.85, '#9333ea'); // Velvet royal violet
      grad.addColorStop(1, '#0f172a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1024);

      drawMicroScales(ctx, 1024, 1024, 0.16);

      // Glowing Neon Turquoise Labyrinth Stripes
      ctx.strokeStyle = '#22d3ee';
      ctx.lineWidth = 16;
      ctx.lineCap = 'round';
      ctx.shadowColor = '#00f7ff';
      ctx.shadowBlur = 12;

      for (let i = 180; i < 920; i += 64) {
        ctx.beginPath();
        ctx.moveTo(i, 70);
        for (let y = 70; y < 950; y += 45) {
          ctx.lineTo(i + Math.sin(y * 0.038 + i) * 36, y);
        }
        ctx.stroke();
      }
      ctx.shadowBlur = 0;

      // Soft ambient iridescent gold flecks between stripes
      ctx.fillStyle = 'rgba(251, 191, 36, 0.35)';
      for (let i = 220; i < 880; i += 80) {
        for (let y = 140; y < 880; y += 90) {
          ctx.beginPath();
          ctx.arc(i + Math.sin(y) * 15, y, 7, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      return new THREE.CanvasTexture(c);
    }

    // 4. Glowing Fluorescent Neon Tetra (Paracheirodon innesi)
    function createTetraTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 256;
      const ctx = c.getContext('2d');

      // Shimmering iridescent silver-slate dorsal
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, 512, 256);

      // Laser Electric Neon Cyan Stripe with glowing gradient
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 14;
      const blueGrad = ctx.createLinearGradient(0, 55, 0, 125);
      blueGrad.addColorStop(0, '#38bdf8');
      blueGrad.addColorStop(0.45, '#00ffff');
      blueGrad.addColorStop(0.85, '#0284c7');
      ctx.fillStyle = blueGrad;
      ctx.fillRect(0, 60, 440, 54);
      ctx.shadowBlur = 0;

      // Saturated glowing carmine ruby-red belly
      const redGrad = ctx.createLinearGradient(0, 120, 0, 225);
      redGrad.addColorStop(0, '#f43f5e');
      redGrad.addColorStop(0.5, '#ef4444');
      redGrad.addColorStop(1, '#b91c1c');
      ctx.fillStyle = redGrad;
      ctx.fillRect(175, 120, 337, 105);

      // Metallic silver pearlescent belly
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(30, 125, 145, 80);

      return new THREE.CanvasTexture(c);
    }

    // Fin Ray Texture for Translucent Ribbed Fins
    function createFinRayTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');

      ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.fillRect(0, 0, 256, 256);

      // Fin rays (striated spines)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 3;
      for (let x = 12; x < 256; x += 18) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + (x - 128) * 0.35, 256);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    const sandTexture = createSandTexture();
    const clownTex = createClownfishTexture();
    const tangTex = createTangTexture();
    const discusTex = createDiscusTexture();
    const tetraTex = createTetraTexture();
    const finRayTex = createFinRayTexture();

    // =========================================================================
    // THE AQUARIUM STRUCTURE (Glass Tank, Wooden Cabinet & Lamp Fixture)
    // =========================================================================
    const tankGroup = new THREE.Group();
    scene.add(tankGroup);

    // Glass Tank Mesh
    const glassGeometry = new THREE.BoxGeometry(TANK_WIDTH, TANK_HEIGHT, TANK_DEPTH);
    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x88ccff,
      transmission: 0.92,
      opacity: 1,
      transparent: true,
      roughness: 0.04,
      ior: 1.48,
      reflectivity: 0.8,
      thickness: 1.5,
      side: THREE.BackSide,
      depthWrite: false
    });
    const glassMesh = new THREE.Mesh(glassGeometry, glassMaterial);
    tankGroup.add(glassMesh);

    // Water Surface plane
    const waterGeom = new THREE.PlaneGeometry(TANK_WIDTH - 0.2, TANK_DEPTH - 0.2, 48, 48);
    const waterMat = new THREE.MeshStandardMaterial({
      color: 0x38bdf8,
      roughness: 0.1,
      metalness: 0.2,
      transparent: true,
      opacity: 0.65,
      side: THREE.DoubleSide
    });
    const waterMesh = new THREE.Mesh(waterGeom, waterMat);
    waterMesh.rotation.x = -Math.PI / 2;
    waterMesh.position.y = TANK_HEIGHT / 2 - 0.2;
    tankGroup.add(waterMesh);

    // Aluminum Rims & Overhead Lamp
    const rimMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4, metalness: 0.8 });
    const topRimGeom = new THREE.BoxGeometry(TANK_WIDTH + 0.6, 0.4, TANK_DEPTH + 0.6);
    const topRim = new THREE.Mesh(topRimGeom, rimMat);
    topRim.position.y = TANK_HEIGHT / 2 + 0.1;
    tankGroup.add(topRim);

    const botRimGeom = new THREE.BoxGeometry(TANK_WIDTH + 0.6, 0.6, TANK_DEPTH + 0.6);
    const botRim = new THREE.Mesh(botRimGeom, rimMat);
    botRim.position.y = -TANK_HEIGHT / 2 - 0.2;
    tankGroup.add(botRim);

    const lampGeom = new THREE.BoxGeometry(TANK_WIDTH - 4, 0.5, 3);
    const lampMesh = new THREE.Mesh(lampGeom, rimMat);
    lampMesh.position.set(0, TANK_HEIGHT / 2 + 1.2, 0);
    tankGroup.add(lampMesh);

    // Sandy Sea Bottom
    const sandGeom = new THREE.PlaneGeometry(TANK_WIDTH - 0.1, TANK_DEPTH - 0.1, 64, 48);
    const sandPos = sandGeom.attributes.position;
    for (let i = 0; i < sandPos.count; i++) {
      const x = sandPos.getX(i);
      const y = sandPos.getY(i);
      const zOffset = Math.sin(x * 0.4) * 0.45 + Math.cos(y * 0.5) * 0.35 + Math.sin(x * 1.2 + y * 0.8) * 0.15;
      sandPos.setZ(i, zOffset);
    }
    sandGeom.computeVertexNormals();

    const sandMat = new THREE.MeshStandardMaterial({
      map: sandTexture,
      roughness: 0.85,
      metalness: 0.05
    });
    const sandMesh = new THREE.Mesh(sandGeom, sandMat);
    sandMesh.rotation.x = -Math.PI / 2;
    sandMesh.position.y = -TANK_HEIGHT / 2 + 0.3;
    sandMesh.receiveShadow = true;
    tankGroup.add(sandMesh);

    // Caustics Overlay Projector plane
    const causticsPlaneMat = new THREE.MeshBasicMaterial({
      map: causticsTexture,
      transparent: true,
      opacity: 0.38,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const causticsMesh = new THREE.Mesh(sandGeom, causticsPlaneMat);
    causticsMesh.rotation.x = -Math.PI / 2;
    causticsMesh.position.y = -TANK_HEIGHT / 2 + 0.32;
    tankGroup.add(causticsMesh);

    // Volumetric Light Beams
    const lightBeamsGroup = new THREE.Group();
    scene.add(lightBeamsGroup);

    const beamGeom = new THREE.CylinderGeometry(0.3, 2.2, TANK_HEIGHT, 16, 1, true);
    const beamMat = new THREE.MeshBasicMaterial({
      color: 0x93c5fd,
      transparent: true,
      opacity: 0.07,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const beams = [];
    for (let i = 0; i < 7; i++) {
      const beam = new THREE.Mesh(beamGeom, beamMat);
      beam.position.set(
        (Math.random() - 0.5) * (TANK_WIDTH - 6),
        0.5,
        (Math.random() - 0.5) * (TANK_DEPTH - 4)
      );
      beam.rotation.z = (Math.random() - 0.5) * 0.2;
      beam.rotation.x = (Math.random() - 0.5) * 0.15;
      beam.baseOpacity = 0.04 + Math.random() * 0.05;

    // Sculpted Rocks & Pebbles
    const rockMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.85, metalness: 0.1 });
    const mossMat = new THREE.MeshStandardMaterial({ color: 0x166534, roughness: 0.9, metalness: 0.05 });

    function createOrganicRock(radius, detail) {
      const geom = new THREE.DodecahedronGeometry(radius, detail);
      const pos = geom.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vy = pos.getY(i);
        const vz = pos.getZ(i);
        const noise = 1 + (Math.sin(vx * 2.5) * Math.cos(vy * 2.5) * Math.sin(vz * 2.5)) * 0.35;
        pos.setXYZ(i, vx * noise, vy * (noise * 0.85), vz * noise);
      }
      geom.computeVertexNormals();
      return geom;
    }

    const rockClusters = [

    const pebbleGeom = new THREE.SphereGeometry(0.35, 8, 8);

    // Dynamic Plants & Grass
    const plantStems = [];
    function createPlantBlade(height, width) {
      const segs = 9;
      const geom = new THREE.PlaneGeometry(width, height, 1, segs);

    const plantBladeMat = new THREE.MeshStandardMaterial({

    });
    const darkGrassMat = new THREE.MeshStandardMaterial({
      color: 0x15803d,

      opacity: 0.92
    });

    const plantBushes = [
      { x: -9.5, z: -3, count: 24, h: 7.5 },
      { x: -7.5, z: 2.5, count: 18, h: 5.5 },
      { x: 8.5, z: -2.5, count: 28, h: 8.0 },
      { x: 6.0, z: 2.5, count: 16, h: 4.5 },
      { x: 1.5, z: -4.5, count: 22, h: 6.5 },
      { x: -2.0, z: -4.0, count: 20, h: 6.0 }
    ];

    plantBushes.forEach(bush => {
      for (let i = 0; i < bush.count; i++) {
        const bladeHeight = bush.h * (0.7 + Math.random() * 0.6);
        const bladeWidth = 0.35 + Math.random() * 0.25;
        const geom = createPlantBlade(bladeHeight, bladeWidth);
        const mat = (i % 2 === 0) ? plantBladeMat : darkGrassMat;
        const mesh = new THREE.Mesh(geom, mat);

        plantStems.push({
          mesh: mesh,

          strength: 0.25 + Math.random() * 0.2
        });
      }
    });

    function updatePlants(time) {
      for (let i = 0; i < plantStems.length; i++) {
        const p = plantStems[i];
        const pos = p.geom.attributes.position;
        const orig = p.origPositions;
        const currentForce = Math.sin(time * p.speed + p.swayOffset);

        for (let j = 0; j < pos.count; j++) {
          const y = orig.getY(j);
          const bend = (y * y) * 0.04 * currentForce * p.strength;
          pos.setX(j, orig.getX(j) + bend);
          pos.setZ(j, orig.getZ(j) + Math.cos(time * 0.8 + p.swayOffset) * (y * 0.03));
        }
        pos.needsUpdate = true;
      }
    }

    // Aerator Bubbles
    let bubblesEnabled = true;

    const bubbleGeom = new THREE.SphereGeometry(0.12, 8, 8);
    const bubbleMat = new THREE.MeshPhysicalMaterial({
      color: 0xe0f2fe,

      ior: 1.1,
      transparent: true,

    });

    const bubbleGroup = new THREE.Group();
    scene.add(bubbleGroup);
    const bubbles = [];
    const aeratorSources = [
      { x: -8.5, z: -3.5 },
      { x: 8.0, z: -3.0 }
    ];

    for (let i = 0; i < BUBBLE_COUNT; i++) {
      const bubble = new THREE.Mesh(bubbleGeom, bubbleMat);
      resetBubble(bubble);
      bubble.position.y = -TANK_HEIGHT / 2 + Math.random() * TANK_HEIGHT;
      bubbleGroup.add(bubble);
      bubbles.push(bubble);
    }

    function resetBubble(b) {
      const source = aeratorSources[Math.floor(Math.random() * aeratorSources.length)];
      b.position.x = source.x + (Math.random() - 0.5) * 0.8;
      b.position.y = -TANK_HEIGHT / 2 + 0.4;
      b.position.z = source.z + (Math.random() - 0.5) * 0.8;
      b.speed = 2.5 + Math.random() * 2.2;
      b.wobbleFreq = 4 + Math.random() * 4;
      b.wobbleAmp = 0.06 + Math.random() * 0.06;
      b.wobblePhase = Math.random() * Math.PI * 2;
      const s = 0.5 + Math.random() * 1.1;
      b.scale.set(s, s, s);
    }

    function updateBubbles(dt, time) {
      if (!bubblesEnabled) {
        bubbleGroup.visible = false;
        return;
      }
      bubbleGroup.visible = true;
      for (let i = 0; i < bubbles.length; i++) {
        const b = bubbles[i];
        b.position.y += b.speed * dt;
        b.position.x += Math.sin(time * b.wobbleFreq + b.wobblePhase) * b.wobbleAmp * dt * 8;
        b.position.z += Math.cos(time * b.wobbleFreq + b.wobblePhase) * b.wobbleAmp * dt * 8;
        if (b.position.y > TANK_HEIGHT / 2 - 0.3) {
          resetBubble(b);
        }
      }
    }

    // =========================================================================
    // ADVANCED ANATOMICAL 3D FISH ENGINE
    // - Sculpted fusiform body mesh (Egg/teardrop cross sections, snout, lips, peduncle)
    // - Volumetric sculpted fins (Caudal, Dorsal, Anal, Pectoral wings, Pelvic rays)
    // - Layered 3D realistic eyes with pupil, colored iris & corneal reflection
    // - Turning spine curvature + traveling wave kinematics
    // =========================================================================

    function createSculptedFishBody(species) {
      const segsZ = 36;   // Longitudinal slices along the spine (snout to tail)
      const segsRad = 24; // Radial vertices around the fish body perimeter

      const geom = new THREE.BufferGeometry();
      const positions = [];
      const uvs = [];
      const indices = [];

      // Length of fish model
      const totalLength = 2.6;

      for (let j = 0; j <= segsZ; j++) {
        const s = j / segsZ; // 0.0 (snout/mouth) -> 1.0 (caudal peduncle)
        const z = -totalLength / 2 + s * totalLength;

        // Biological height & width profile functions
        let h = 0;
        let w = 0;
        let yCenter = 0; // Curve spine vertically (arch of back vs belly drop)

        if (species === 'clownfish') {
          // Rounded friendly torpedo with high dorsal ridge and soft drooping belly
          if (s < 0.12) {
            // Snout / mouth taper
            const st = s / 0.12;
            h = 0.25 + 0.55 * Math.sin(st * Math.PI * 0.5);
            w = 0.2 + 0.42 * Math.sin(st * Math.PI * 0.5);
            yCenter = -0.05 * (1 - st);
          } else if (s < 0.75) {
            // Torso & abdomen
            const st = (s - 0.12) / 0.63;
            h = 0.8 + 0.38 * Math.sin(st * Math.PI);
            w = 0.62 + 0.18 * Math.sin(st * Math.PI);
            yCenter = -0.12 * Math.sin(st * Math.PI); // Belly hangs slightly below axis
          } else {
            // Caudal peduncle
            const st = (s - 0.75) / 0.25;
            h = 0.8 * (1 - st * 0.68);
            w = 0.62 * (1 - st * 0.78);
            yCenter = -0.12 * (1 - st);
          }
        } else if (species === 'tang') {
          // Oval deep body, steep forehead, compressed flanks
          if (s < 0.15) {
            const st = s / 0.15;
            h = 0.28 + 0.85 * Math.sin(st * Math.PI * 0.5);
            w = 0.18 + 0.32 * Math.sin(st * Math.PI * 0.5);
            yCenter = -0.08 * (1 - st);
          } else if (s < 0.78) {
            const st = (s - 0.15) / 0.63;
            h = 1.13 + 0.45 * Math.sin(st * Math.PI);
            w = 0.5 + 0.15 * Math.sin(st * Math.PI);
            yCenter = 0.05 * Math.sin(st * Math.PI);
          } else {
            const st = (s - 0.78) / 0.22;
            h = 1.13 * (1 - st * 0.75);
            w = 0.5 * (1 - st * 0.82);
            yCenter = 0.05 * (1 - st);
          }
        } else if (species === 'discus') {
          // Spectacular tall disk shape (Symphysodon)
          if (s < 0.15) {
            const st = s / 0.15;
            h = 0.4 + 1.6 * Math.sin(st * Math.PI * 0.5);
            w = 0.15 + 0.25 * Math.sin(st * Math.PI * 0.5);
          } else if (s < 0.82) {
            const st = (s - 0.15) / 0.67;
            h = 2.0 + 0.55 * Math.sin(st * Math.PI);
            w = 0.4 + 0.08 * Math.sin(st * Math.PI);
          } else {
            const st = (s - 0.82) / 0.18;
            h = 2.0 * (1 - st * 0.82);
            w = 0.4 * (1 - st * 0.85);
          }
        } else {
          // Neon Tetra: sleek minnow / characin torpedo
          if (s < 0.15) {
            const st = s / 0.15;
            h = 0.18 + 0.42 * Math.sin(st * Math.PI * 0.5);
            w = 0.15 + 0.3 * Math.sin(st * Math.PI * 0.5);
          } else if (s < 0.75) {
            const st = (s - 0.15) / 0.6;
            h = 0.6 + 0.2 * Math.sin(st * Math.PI);
            w = 0.45 + 0.12 * Math.sin(st * Math.PI);
          } else {
            const st = (s - 0.75) / 0.25;
            h = 0.6 * (1 - st * 0.7);
            w = 0.45 * (1 - st * 0.78);
          }
        }

        // Generate radial points for this cross section
        for (let i = 0; i <= segsRad; i++) {
          const theta = (i / segsRad) * Math.PI * 2;
          const cosT = Math.cos(theta);
          const sinT = Math.sin(theta);

          // Organic fish cross-section: egg/teardrop shape
          // Narrower dorsal crest (top), rounder flanks, subtle ventral keel
          const x = (w * 0.5) * sinT * (1.0 - 0.15 * cosT);
          const y = yCenter + (h * 0.5) * cosT;

          positions.push(x, y, z);
          uvs.push(s, i / segsRad);
        }
      }

      // Generate polygon indices
      for (let j = 0; j < segsZ; j++) {
        for (let i = 0; i < segsRad; i++) {
          const row1 = j * (segsRad + 1);
          const row2 = (j + 1) * (segsRad + 1);

          indices.push(row1 + i, row2 + i, row1 + i + 1);
          indices.push(row2 + i, row2 + i + 1, row1 + i + 1);
        }
      }

      geom.setIndex(indices);
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.computeVertexNormals();

      return geom;
    }

    // Volumetric Sculpted Fins with natural curvature
    function createSculptedFin(type, species) {
      const geom = new THREE.BufferGeometry();
      const positions = [];
      const uvs = [];
      const indices = [];

      let segsU = 8;
      let segsV = 4;

      if (type === 'caudal') {
        // Tail fan fin (X: lateral thickness, Y: vertical spread, Z: longitudinal flare)
        for (let j = 0; j <= segsV; j++) {
          const v = j / segsV; // 0 at base, 1 at trailing edge
          const z = v * 1.1; // Extends backward
          let heightSpread = 0.5 + v * 1.35;
          if (species === 'tang') heightSpread = 0.6 + v * 1.5; // Lunate tips
          if (species === 'discus') heightSpread = 0.8 + v * 1.7;

          for (let i = 0; i <= segsU; i++) {
            const u = (i / segsU) * 2 - 1; // -1 (bottom tip) to +1 (top tip)
            let y = u * (heightSpread / 2);

            // Scalloped trailing edge curve
            let zCurve = z;
            if (species === 'tang' || species === 'tetra') {
              // Forked / indented middle
              zCurve += (1 - Math.abs(u)) * (-0.2 * v);
            } else {
              // Rounded fan
              zCurve += (1 - u * u) * (0.15 * v);
            }

            // Slight membrane thickness tapering to edge
            const x = Math.sin(u * Math.PI) * (0.04 * (1 - v));

            positions.push(x, y, zCurve);
            uvs.push((u + 1) * 0.5, v);
          }
        }
      } else if (type === 'dorsal') {
        // Dorsal fin (Top ridge)
        for (let j = 0; j <= segsV; j++) {
          const v = j / segsV; // 0 at back body attach, 1 at fin crest
          for (let i = 0; i <= segsU; i++) {
            const u = i / segsU; // 0 (front) to 1 (rear)
            const z = (u - 0.5) * 1.4;

            // Arched crest curve
            let finHeight = Math.sin(u * Math.PI) * 0.65;
            if (species === 'discus') finHeight = Math.sin(u * Math.PI) * 1.1;
            if (species === 'tang') finHeight = Math.sin(Math.pow(u, 0.7) * Math.PI) * 0.55;

            const y = v * finHeight;
            const x = (1 - v) * 0.03 * Math.sin(u * Math.PI);

            positions.push(x, y, z);
            uvs.push(u, v);
          }
        }
      } else if (type === 'anal') {
        // Anal fin (Rear underside)
        for (let j = 0; j <= segsV; j++) {
          const v = j / segsV;
          for (let i = 0; i <= segsU; i++) {
            const u = i / segsU;
            const z = (u - 0.5) * 0.9;
            const finHeight = Math.sin(u * Math.PI) * (species === 'discus' ? 0.9 : 0.45);
            const y = -v * finHeight;
            const x = (1 - v) * 0.02 * Math.sin(u * Math.PI);

            positions.push(x, y, z);
            uvs.push(u, v);
          }
        }
      } else if (type === 'pectoral') {
        // Pectoral fin (Graceful wing fan)
        for (let j = 0; j <= segsV; j++) {
          const v = j / segsV;
          for (let i = 0; i <= segsU; i++) {
            const u = i / segsU;
            // Wing sweep
            const z = v * 0.65 + (u - 0.5) * 0.2;
            const y = (u - 0.5) * (0.35 + v * 0.35);
            // Slight aerodynamic cup curvature
            const x = Math.sin(u * Math.PI) * 0.05 + v * 0.08;

            positions.push(x, y, z);
            uvs.push(u, v);
          }
        }
      }

      for (let j = 0; j < segsV; j++) {
        for (let i = 0; i < segsU; i++) {
          const row1 = j * (segsU + 1);
          const row2 = (j + 1) * (segsU + 1);

          indices.push(row1 + i, row2 + i, row1 + i + 1);
          indices.push(row2 + i, row2 + i + 1, row1 + i + 1);
        }
      }

      geom.setIndex(indices);
      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.computeVertexNormals();

      return geom;
    }

    // Complete Detailed Fish Assembly
    function createDetailedFishMesh(speciesType, texture) {
      const fishObj = new THREE.Group();

      // 1. Sculpted Body
      const bodyGeom = createSculptedFishBody(speciesType);
      const bodyMat = new THREE.MeshStandardMaterial({
        map: texture,
        roughness: 0.16,
        metalness: 0.28,
        side: THREE.DoubleSide
      });
      if (speciesType === 'tetra') {
        bodyMat.emissive = new THREE.Color(0x0284c7);
        bodyMat.emissiveIntensity = 0.45;
      } else if (speciesType === 'discus') {
        bodyMat.emissive = new THREE.Color(0x0891b2);
        bodyMat.emissiveIntensity = 0.18;
      } else if (speciesType === 'tang') {
        bodyMat.emissive = new THREE.Color(0x1d4ed8);
        bodyMat.emissiveIntensity = 0.12;
      }
      const bodyMesh = new THREE.Mesh(bodyGeom, bodyMat);
      bodyMesh.castShadow = true;
      fishObj.add(bodyMesh);

      // 2. Translucent Ribbed Fins
      const finMat = new THREE.MeshStandardMaterial({
        map: texture,
        alphaMap: finRayTex,
        transparent: true,
        opacity: 0.92,
        roughness: 0.22,
        metalness: 0.2,
        side: THREE.DoubleSide,
        depthWrite: false
      });

      // Tail / Caudal Fin
      const tailGeom = createSculptedFin('caudal', speciesType);
      const tailMesh = new THREE.Mesh(tailGeom, finMat);
      tailMesh.position.set(0, 0, 1.25);
      fishObj.add(tailMesh);

      // Dorsal Fin
      const dorsalGeom = createSculptedFin('dorsal', speciesType);
      const dorsalMesh = new THREE.Mesh(dorsalGeom, finMat);
      let dorsalY = 0.42;
      let dorsalZ = -0.1;
      if (speciesType === 'discus') { dorsalY = 1.05; dorsalZ = 0.05; }
      else if (speciesType === 'tang') { dorsalY = 0.65; }
      dorsalMesh.position.set(0, dorsalY, dorsalZ);
      fishObj.add(dorsalMesh);

      // Anal Fin
      const analGeom = createSculptedFin('anal', speciesType);
      const analMesh = new THREE.Mesh(analGeom, finMat);
      let analY = -0.42;
      let analZ = 0.45;
      if (speciesType === 'discus') { analY = -1.05; analZ = 0.35; }
      else if (speciesType === 'tang') { analY = -0.65; }
      analMesh.position.set(0, analY, analZ);
      fishObj.add(analMesh);

      // Pectoral Fins (Left & Right)
      const pectGeom = createSculptedFin('pectoral', speciesType);
      const leftPect = new THREE.Mesh(pectGeom, finMat);
      const rightPect = new THREE.Mesh(pectGeom, finMat);

      let pectX = 0.32;
      let pectY = -0.12;
      let pectZ = -0.55;
      if (speciesType === 'discus') { pectX = 0.22; pectY = -0.25; }
      else if (speciesType === 'tang') { pectX = 0.28; }

      leftPect.position.set(pectX, pectY, pectZ);
      leftPect.rotation.set(0.2, 0.45, -0.3);
      fishObj.add(leftPect);

      rightPect.position.set(-pectX, pectY, pectZ);
      rightPect.rotation.set(0.2, -0.45, 0.3);
      fishObj.add(rightPect);

      // Pelvic / Ventral Fins (Paired rays underneath chest)
      const pelvicGeom = new THREE.ConeGeometry(0.04, speciesType === 'discus' ? 1.2 : 0.45, 6);
      pelvicGeom.rotateX(-0.4);
      pelvicGeom.translate(0, -0.2, 0);

      const leftPelvic = new THREE.Mesh(pelvicGeom, finMat);
      leftPelvic.position.set(0.12, speciesType === 'discus' ? -0.9 : -0.38, -0.4);
      fishObj.add(leftPelvic);

      const rightPelvic = new THREE.Mesh(pelvicGeom, finMat);
      rightPelvic.position.set(-0.12, speciesType === 'discus' ? -0.9 : -0.38, -0.4);
      fishObj.add(rightPelvic);

      // 3. 3D Realistic Mouth / Lips
      const mouthLipGeom = new THREE.TorusGeometry(0.1, 0.038, 8, 16);
      const mouthMat = new THREE.MeshStandardMaterial({
        color: speciesType === 'clownfish' ? 0xff8c42 : 0x1e293b,
        roughness: 0.5
      });
      const mouthMesh = new THREE.Mesh(mouthLipGeom, mouthMat);
      mouthMesh.position.set(0, -0.06, -1.28);
      mouthMesh.scale.set(1, 0.7, 1);
      fishObj.add(mouthMesh);

      // 4. 3D Layered Glossy Realistic Eyes
      const scleraGeom = new THREE.SphereGeometry(0.13, 16, 16);
      scleraGeom.scale(1, 1, 0.6);

      let irisColor = 0xf59e0b; // Amber-gold for Clownfish
      if (speciesType === 'tang') irisColor = 0x1e3a8a;
      else if (speciesType === 'discus') irisColor = 0xdc2626; // Ruby red
      else if (speciesType === 'tetra') irisColor = 0x38bdf8;

      const scleraMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 });
      const irisGeom = new THREE.CylinderGeometry(0.08, 0.08, 0.04, 16);
      irisGeom.rotateX(Math.PI / 2);
      const irisMat = new THREE.MeshBasicMaterial({ color: irisColor });

      const pupilGeom = new THREE.CylinderGeometry(0.045, 0.045, 0.05, 16);
      pupilGeom.rotateX(Math.PI / 2);
      const pupilMat = new THREE.MeshBasicMaterial({ color: 0x020202 });

      // Corneal clearcoat lens bulge
      const corneaGeom = new THREE.SphereGeometry(0.14, 16, 16);
      corneaGeom.scale(1, 1, 0.65);
      const corneaMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        transmission: 0.95,
        roughness: 0.02,
        clearcoat: 1.0,
        clearcoatRoughness: 0.05,
        transparent: true
      });

      function buildEyeGroup(isRight) {
        const eyeGroup = new THREE.Group();
        const sclera = new THREE.Mesh(scleraGeom, scleraMat);
        const iris = new THREE.Mesh(irisGeom, irisMat);
        const pupil = new THREE.Mesh(pupilGeom, pupilMat);
        const cornea = new THREE.Mesh(corneaGeom, corneaMat);

        iris.position.z = -0.07;
        pupil.position.z = -0.075;
        cornea.position.z = -0.01;

        eyeGroup.add(sclera);
        eyeGroup.add(iris);
        eyeGroup.add(pupil);
        eyeGroup.add(cornea);

        let eyeX = isRight ? 0.32 : -0.32;
        let eyeY = 0.12;
        let eyeZ = -0.92;
        if (speciesType === 'discus') { eyeX = isRight ? 0.22 : -0.22; eyeY = 0.22; eyeZ = -0.85; }
        else if (speciesType === 'tang') { eyeX = isRight ? 0.28 : -0.28; eyeY = 0.2; eyeZ = -0.9; }

        eyeGroup.position.set(eyeX, eyeY, eyeZ);
        eyeGroup.rotation.y = isRight ? 0.32 : -0.32;
        return eyeGroup;
      }

      fishObj.add(buildEyeGroup(true));
      fishObj.add(buildEyeGroup(false));

      return {
        root: fishObj,
        bodyMesh: bodyMesh,
        bodyGeom: bodyGeom,
        origBodyPositions: bodyGeom.attributes.position.clone(),
        tailMesh: tailMesh,
        tailGeom: tailGeom,
        origTailPositions: tailGeom.attributes.position.clone(),
        leftPect: leftPect,
        rightPect: rightPect
      };
    }

    // =========================================================================
    // NATURAL HYDRODYNAMIC FISH AI & SWIMMING KINEMATICS
    // =========================================================================
    const fishes = [];

    class FishAgent {
      constructor(species, texture, scale = 1.0) {
        this.species = species;
        this.data = createDetailedFishMesh(species, texture);
        this.mesh = this.data.root;
        this.mesh.scale.set(scale, scale, scale);
        scene.add(this.mesh);

        this.position = new THREE.Vector3(
          (Math.random() - 0.5) * (TANK_WIDTH - 6),
          (Math.random() - 0.5) * (TANK_HEIGHT - 5),
          (Math.random() - 0.5) * (TANK_DEPTH - 5)
        );
        this.mesh.position.copy(this.position);

        this.velocity = new THREE.Vector3(
          (Math.random() - 0.5) * 2,
          (Math.random() - 0.5) * 0.6,
          (Math.random() - 0.5) * 2
        ).normalize().multiplyScalar(1.2 + Math.random() * 0.8);

        this.prevVelocity = this.velocity.clone();
        this.turningCurvature = 0; // Dynamic arching of spine into turns

        this.maxSpeed = (species === 'tetra') ? 2.8 : (species === 'discus' ? 1.6 : 2.2);
        this.swimCycle = Math.random() * 100;
        this.swimFreq = 4.2 + Math.random() * 1.8;

        this.targetFood = null;
      }

      update(dt, time, foodList) {
        this.swimCycle += dt * this.swimFreq * (this.velocity.length() / 1.4);

        // 1. Food Seeking AI
        if (foodList.length > 0) {
          let closestFood = null;
          let closestDist = Infinity;
          for (let f of foodList) {
            const d = this.position.distanceTo(f.position);
            if (d < 15 && d < closestDist) {
              closestDist = d;
              closestFood = f;
            }
          }
          if (closestFood) {
            const foodDir = new THREE.Vector3().subVectors(closestFood.position, this.position).normalize();
            this.velocity.lerp(foodDir.multiplyScalar(this.maxSpeed * 1.6), 0.08);

            if (closestDist < 1.0) {
              closestFood.eaten = true;
              playFeedSound();
            }
          }
        }

        // 2. Random graceful wandering
        if (Math.random() < 0.025) {
          const wander = new THREE.Vector3(
            (Math.random() - 0.5) * 2.2,
            (Math.random() - 0.5) * 0.6,
            (Math.random() - 0.5) * 2.2
          ).normalize();
          this.velocity.add(wander.multiplyScalar(0.45));
        }

        // 3. Tank Boundary Repulsion (Graceful turn away from glass & rocks)
        const marginX = TANK_WIDTH / 2 - 2.5;
        const marginY = TANK_HEIGHT / 2 - 2.0;
        const marginZ = TANK_DEPTH / 2 - 2.5;

        if (this.position.x > marginX) this.velocity.x -= 3.2 * dt;
        if (this.position.x < -marginX) this.velocity.x += 3.2 * dt;
        if (this.position.y > marginY) this.velocity.y -= 2.8 * dt;
        if (this.position.y < -marginY) this.velocity.y += 3.8 * dt;
        if (this.position.z > marginZ) this.velocity.z -= 3.2 * dt;
        if (this.position.z < -marginZ) this.velocity.z += 3.2 * dt;

        this.velocity.clampLength(0.8, this.maxSpeed);
        this.position.addScaledVector(this.velocity, dt);
        this.mesh.position.copy(this.position);

        // 4. Turning Dynamics: calculate angular turn rate for body bending
        const currentHeading = new THREE.Vector2(this.velocity.x, this.velocity.z).normalize();
        const prevHeading = new THREE.Vector2(this.prevVelocity.x, this.prevVelocity.z).normalize();
        const turnCross = prevHeading.x * currentHeading.y - prevHeading.y * currentHeading.x;
        this.turningCurvature = THREE.MathUtils.lerp(this.turningCurvature, turnCross * 12.0, 0.1);
        this.prevVelocity.copy(this.velocity);

        // Smooth forward orientation (Head at -Z points along velocity)
        if (this.velocity.lengthSq() > 0.01) {
          const lookTarget = this.position.clone().add(this.velocity);
          const m = new THREE.Matrix4().lookAt(this.position, lookTarget, new THREE.Vector3(0, 1, 0));
          const targetQuat = new THREE.Quaternion().setFromRotationMatrix(m);

          // Bank slightly into turn
          const bankQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), this.turningCurvature * 0.35);
          targetQuat.multiply(bankQuat);

          this.mesh.quaternion.slerp(targetQuat, 0.09);
        }

        // 5. High-Fidelity Hydrodynamic Spine Wave
        // Head moves very little (< 5%), tail does 85% of movement, plus turning arch
        const pos = this.data.bodyGeom.attributes.position;
        const orig = this.data.origBodyPositions;
        const wavePhase = this.swimCycle;

        for (let i = 0; i < pos.count; i++) {
          const z = orig.getZ(i);
          // Normalized coordinate from snout (-1.3) to tail (+1.3)
          const normZ = (z + 1.3) / 2.6; // 0 at head, 1 at tail

          // Accelerating wave amplitude: (normZ)^1.8 ensures stable head
          const waveAmp = 0.24 * Math.pow(normZ, 1.8);
          const travelingWave = Math.sin(wavePhase - z * 3.4) * waveAmp;

          // Turning curvature arch (fish bends into turn)
          const turnBend = this.turningCurvature * Math.pow(normZ, 2.0) * 0.18;

          pos.setX(i, orig.getX(i) + travelingWave + turnBend);
        }
        pos.needsUpdate = true;

        // 6. Tail Fin Flexible Flap with Natural Phase Delay
        const tailPos = this.data.tailGeom.attributes.position;
        const origTail = this.data.origTailPositions;
        const tailPhaseLag = wavePhase - 0.7;

        for (let i = 0; i < tailPos.count; i++) {
          const tz = origTail.getZ(i);
          const flap = Math.sin(tailPhaseLag - tz * 2.8) * (0.28 + tz * 0.22);
          tailPos.setX(i, origTail.getX(i) + flap + this.turningCurvature * 0.2);
        }
        tailPos.needsUpdate = true;

        // 7. Pectoral Fins Rowing Flutter
        const pectRow = Math.sin(this.swimCycle * 1.2) * 0.28;
        this.data.leftPect.rotation.z = -0.3 + pectRow;
        this.data.rightPect.rotation.z = 0.3 - pectRow;
      }
    }

    // Spawn Population
    function spawnFish(species, count) {
      let tex = clownTex;
      let scale = 1.0;
      if (species === 'tang') { tex = tangTex; scale = 1.15; }
      else if (species === 'discus') { tex = discusTex; scale = 1.25; }
      else if (species === 'tetra') { tex = tetraTex; scale = 0.55; }

      for (let i = 0; i < count; i++) {
        fishes.push(new FishAgent(species, tex, scale * (0.88 + Math.random() * 0.24)));
      }
    }

    const foodItems = [];

    const foodMat = new THREE.MeshStandardMaterial({
      color: 0xd97706,
      roughness: 0.9,
      metalness: 0.1
    });

    function dropFood(targetPos = null) {
      playFeedSound();

      for (let i = 0; i < 7; i++) {
        const flake = new THREE.Mesh(foodGeom, foodMat);
        let startX, startZ;
        if (targetPos) {
          startX = targetPos.x + (Math.random() - 0.5) * 2;
          startZ = targetPos.z + (Math.random() - 0.5) * 2;
        } else {
          startX = (Math.random() - 0.5) * (TANK_WIDTH - 6);
          startZ = (Math.random() - 0.5) * (TANK_DEPTH - 6);
        }

        flake.position.set(startX, TANK_HEIGHT / 2 - 0.4, startZ);
        flake.fallSpeed = 0.6 + Math.random() * 0.5;
        flake.driftPhase = Math.random() * Math.PI * 2;
        flake.eaten = false;
        scene.add(flake);
        foodItems.push(flake);
      }
    }

    function updateFood(dt, time) {
      for (let i = foodItems.length - 1; i >= 0; i--) {
        const f = foodItems[i];
        if (f.eaten) {
          scene.remove(f);
          foodItems.splice(i, 1);
          continue;
        }

        f.position.y -= f.fallSpeed * dt;
        f.position.x += Math.sin(time * 2 + f.driftPhase) * 0.2 * dt;
        f.rotation.x += dt * 1.5;
        f.rotation.y += dt * 2.0;

        if (f.position.y < -TANK_HEIGHT / 2 + 0.4) {
          scene.remove(f);
          foodItems.splice(i, 1);
        }
      }
    }

      if (!isSoundPlaying) {
        audioCtx.resume();
        waterSoundGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        waterSoundGain.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + 1.5);
        isSoundPlaying = true;
        document.getElementById('sound-icon').innerText = '🔊';
        document.getElementById('sound-text').innerText = I18N[currentLang].soundOn;
        soundBtn.classList.add('active');
      } else {
        waterSoundGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
        isSoundPlaying = false;
        document.getElementById('sound-icon').innerText = '🔈';
        document.getElementById('sound-text').innerText = I18N[currentLang].soundOff;
        soundBtn.classList.remove('active');
      }
    });

    // Mobile Stats Drawer Toggle
    const fishInfoCard = document.getElementById('fish-info-card');
    const infoToggleBtn = document.getElementById('info-toggle-btn');
    const closeInfoBtn = document.getElementById('close-info-btn');

    if (infoToggleBtn && fishInfoCard) {
      infoToggleBtn.addEventListener('click', () => {
        fishInfoCard.classList.toggle('mobile-open');
        infoToggleBtn.classList.toggle('active', fishInfoCard.classList.contains('mobile-open'));
      });
    }
    if (closeInfoBtn && fishInfoCard) {
      closeInfoBtn.addEventListener('click', () => {
        fishInfoCard.classList.remove('mobile-open');
        if (infoToggleBtn) infoToggleBtn.classList.remove('active');
      });
    }

    // Initialize Language (Default is English)
    let initialLang = 'en';
    try {
      const saved = localStorage.getItem('aqua_lang');
      if (saved && I18N[saved]) {
        initialLang = saved;
      }
    } catch (e) {
      initialLang = 'en';
    }
    setLanguage(initialLang);

    document.getElementById('download-btn').addEventListener('click', () => {
      const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Aquarium_3D_Ultra.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    });

    // Mobile & Desktop Responsive Camera Adapter
    function updateResponsiveCamera() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const aspect = w / h;
      camera.aspect = aspect;

      if (aspect < 1.0) {
        // Mobile portrait mode: frame the aquarium naturally so it fills the screen
        camera.fov = 58;
        if (currentCameraMode === 'front') {
          camera.position.set(0, 0, 20);
        }
        controls.minDistance = 6;
        controls.maxDistance = 38;
      } else {
        // Landscape & Desktop
        camera.fov = 48;
        if (currentCameraMode === 'front') {
          camera.position.set(0, 0, 26);
        }
        controls.minDistance = 6;
        controls.maxDistance = 42;
      }
      controls.target.set(0, 0, 0);
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }

    window.addEventListener('resize', updateResponsiveCamera);
    window.addEventListener('orientationchange', () => {
      setTimeout(updateResponsiveCamera, 100);
    });
    updateResponsiveCamera();

    // =========================================================================
    // MAIN RENDER & ANIMATION LOOP
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.1);
      const time = clock.getElapsedTime();

      updateCaustics(time);

      const waterPos = waterGeom.attributes.position;
      for (let i = 0; i < waterPos.count; i++) {
        const u = waterPos.getX(i);
        const v = waterPos.getY(i);
        const z = Math.sin(u * 0.8 + time * 1.5) * 0.08 + Math.cos(v * 0.8 + time * 1.2) * 0.08;
        waterPos.setZ(i, z);
      }
      waterPos.needsUpdate = true;

      for (let b of beams) {
        b.material.opacity = b.baseOpacity + Math.sin(time * b.pulseSpeed) * 0.02;
      }

      updatePlants(time);
      updateBubbles(dt, time);
      updateFood(dt, time);

      for (let fish of fishes) {
        fish.update(dt, time, foodItems);
      }

      if (currentCameraMode === 'follow' && followedFish) {
        const offset = followedFish.velocity.clone().normalize().multiplyScalar(-5).add(new THREE.Vector3(0, 1.5, 0));
        const desiredPos = followedFish.position.clone().add(offset);
        camera.position.lerp(desiredPos, 0.04);
        camera.lookAt(followedFish.position);
      } else {
        controls.update();
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
